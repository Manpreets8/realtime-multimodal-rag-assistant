# Production overrides for a single server:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy in front for HTTPS (certificates from Let's Encrypt, renewed automatically) and
# publishes only ports 80 and 443. PostgreSQL, Redis, the API and nginx are reachable only
# inside the Docker network. Required in .env: DOMAIN, JWT_SECRET, POSTGRES_PASSWORD
# (and LLM_API_KEY for answers). See "Deployment" in README.md.

x-production-env: &production-env
  ENVIRONMENT: production  # refuses to start with a weak JWT_SECRET or wildcard CORS; enables HSTS
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
  # The browser-facing origin (scheme://host[:port]); the chat WebSocket checks it too.
  CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://${DOMAIN:?Set DOMAIN in .env}}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  redis:
    ports: !reset []

  migrate:
    environment: *production-env

  api:
    environment: *production-env

  worker:
    environment: *production-env

  web:
    ports: !reset []
    environment:
      # Believe X-Forwarded-For only from Caddy, i.e. from this project's own network.
      TRUSTED_PROXY_CIDR: ${COMPOSE_SUBNET:-172.28.0.0/24}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume, or Let's Encrypt rate limits apply
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/24}

volumes:
  caddy_data:
  caddy_config:
